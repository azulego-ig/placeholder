<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se torne um mebro do [Nome do site]</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:  rgb(255, 183, 0);
            color: white;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #d1d1d1;
            padding: 25px;
            border-radius: 5px;
        }

        h1 {
            text-align: center;
            color: #000000;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #000000;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #444;
            color: white;
            font-size: 16px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgb(255, 183, 0);
            outline: none;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox input {
            width: auto;
        }

        button {
            width: 100%;
            background-color: #717171;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color:  rgb(195, 148, 30);
        }

        .required {
            color: rgb(255, 183, 0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> membro do [nome do site]</h1>

        <form>
            <div class="campo">
                <label>Nome Completo <span class="required">*</span></label>
                <input type="text" name="nome" required>
            </div>

            <div class="campo">
                <label>E-mail <span class="required">*</span></label>
                <input type="email" name="email" required>
            </div>

            <div class="campo">
                <label>Telefone</label>
                <input type="tel" name="telefone" placeholder="(11) 99999-9999">
            </div>

            <div class="campo">
                <label>Idade</label>
                <input type="number" name="idade" min="10" max="100">
            </div>

            <div class="campo">
                <label>Cidade</label>
                <input type="text" name="cidade">
            </div>

            <div class="campo">
                <label>País</label>
                <select name="estado">
                    <option value="">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="PR">Paraná</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="BA">Bahia</option>
                    <option value="GO">Goiás</option>
                    <option value="PE">Pernambuco</option>
                    <option value="CE">Ceará</option>
                </select>
            </div>

            <div class="campo">
                <label>Tipo de receita Favorita</label>
                <select name="tipo">
                    <option value="">Selecione</option>
                    <option value="Bolos e tortas doces">Bolos e tortas doces</option>
                    <option value="Carnes">Carnes</option>
                    <option value="Aves">Aves</option>
                    <option value="Peixes e frutos do mar">Peixes e frutos do mar</option>
                    <option value="Saladas ou molhos">Saladas ou molhos</option>
                    <option value="Sopas">Sopas</option>
                    <option value="Massas">Massas</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Doces e sobremesas">Doces e sobremesas</option>
                    <option value="Lanches">Lanches</option>
                </select>
            </div>

            <div class="campo">
                <label>Receita favorita</label>
                <input type="text" name="receita">

            <div class="campo">
                <label>Álbum Favorito</label>
                <select name="album">
                    <option value="">Selecione</option>
                    <option value="Carnes">Carnes</option>
                    <option value="Mezmerize">Mezmerize</option>
                    <option value="Hypnotize">Hypnotize</option>
                    <option value="System of a Down">System of a Down</option>
                </select>
            </div>

            <div class="campo">
                <label>Há quanto tempo é fã?</label>
                <select name="tempo_fa">
                    <option value="">Selecione</option>
                    <option value="menos_1_ano">Menos de 1 ano</option>
                    <option value="1_3_anos">1 a 3 anos</option>
                    <option value="3_5_anos">3 a 5 anos</option>
                    <option value="5_10_anos">5 a 10 anos</option>
                    <option value="mais_10_anos">Mais de 10 anos</option>
                </select>
            </div>

            <div class="campo">
                <label>Como conheceu o site?</label>
                <select name="como_conheceu">
                    <option value="">Selecione</option>
                    <option value="tv">TV</option>
                    <option value="internet">Internet</option>
                    <option value="amigos">Amigos</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="campo">
                <label>Já foi a algum show?</label>
                <select name="foi_show">
                    <option value="">Selecione</option>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
                    <option value="gostaria">Não, mas gostaria</option>
                </select>
            </div>

            <div class="campo">
                <label>Comentários</label>
                <textarea name="comentarios" placeholder="Fale alguma receite que você gostaria de ver no [nome do site]"></textarea>
            </div>

            <div class="campo checkbox">
                <input type="checkbox" name="newsletter" id="newsletter">
                <label for="newsletter">Quero receber novas receitas por e-mail</label>
            </div>

            <button type="submit"> Se tornar membro</button>
        </form>
    </div>
</body>
</html>
